# =============================================================================
# AuxNet — Configuração do Samba (servidor NAS)
# =============================================================================
#
# Projeto:  AuxNet (Equipe Píton — PUCPR CTIC 2026/S1)
# Hardware: Raspberry Pi 3 Model B (192.168.1.10)
# Pacote:   Samba versão 4.17 (disponível nos repos do Debian 12 Bookworm)
#
# Por que Samba?
#   O Samba implementa o protocolo SMB/CIFS, que é nativo em:
#     - Windows 11: acesso via Explorador de Arquivos (\\192.168.1.10\...)
#     - iOS 13+: acesso via app Arquivos (smb://192.168.1.10)
#     - macOS: Finder → "Conectar ao servidor" → smb://192.168.1.10
#     - Android: apps como CX File Explorer, Solid Explorer
#   Nenhum software adicional precisa ser instalado nos clientes.
#
# Como instalar:
#   1. Copie este arquivo para /etc/samba/smb.conf no Raspberry Pi
#   2. Valide: testparm
#   3. Reinicie: systemctl restart smbd
#
# O script scripts/setup_samba.sh faz tudo isso automaticamente.
# =============================================================================

# ── Seção [global]: configurações que se aplicam a todo o servidor ───────────
[global]

    # Nome do grupo de trabalho da rede Windows.
    # WORKGROUP é o padrão do Windows — usar o mesmo evita que o Windows
    # precise de configuração adicional para encontrar o servidor.
    workgroup = WORKGROUP

    # Descrição do servidor exibida em "Rede" no Explorador de Arquivos.
    # Ajuda os hóspedes a identificar o servidor correto na rede AuxNet.
    server string = AuxNet NAS - Casa de Temporada

    # Nível de log: 1 = somente erros (produção).
    # Aumentar para 3 durante debug (cuidado: arquivo de log cresce rápido).
    # log level = 1
    log level = 1

    # Caminho do arquivo de log do Samba.
    # %m é substituído pelo nome do cliente que conectou — cria um arquivo
    # separado por cliente, facilitando o diagnóstico de problemas.
    log file = /var/log/samba/log.%m

    # Tamanho máximo de cada arquivo de log (em KB).
    # 1000 KB = 1 MB por cliente. Evita crescimento descontrolado do disco.
    max log size = 1000

    # ── Protocolo de autenticação ──────────────────────────────────────────────
    # security = user: autenticação por usuário e senha (nível de usuário).
    #
    # Por que não "security = share" (compartilhamento público)?
    #   "security = share" permitiria acesso sem senha ao compartilhamento.
    #   O guia da casa contém a senha do Wi-Fi da propriedade — expô-lo
    #   publicamente permitiria que qualquer dispositivo na LAN (incluindo
    #   dispositivos comprometidos) acessasse essas credenciais.
    #   Com "security = user", apenas dispositivos com usuário e senha
    #   válidos conseguem montar o compartilhamento.
    security = user

    # Mapeamento de contas de convidado.
    # "nobody" é o usuário Unix sem privilégios usado para conexões guest.
    # Mesmo com guest desabilitado, esta linha é boa prática para garantir
    # que tentativas guest sejam mapeadas para a conta sem privilégios.
    guest account = nobody

    # Codificação de caracteres para nomes de arquivos.
    # UTF-8 garante compatibilidade com nomes de arquivos em português
    # (acentos, cedilha) em todos os clientes.
    unix charset = UTF-8

    # Habilita suporte a ACLs estendidas do Windows no sistema de arquivos.
    # Necessário para que permissões criadas no Windows sejam preservadas.
    # Comentado pois o filesystem do Raspberry Pi (ext4) em modo simples
    # não usa ACLs — as permissões Unix básicas são suficientes aqui.
    # map acl inherit = yes

    # Versão mínima do protocolo SMB aceita.
    # NT1 = SMB 1.0 (legado, desabilitado no Windows 11 por padrão).
    # SMB2 = protocolo moderno, suportado por Windows 7+, iOS 13+.
    # Desabilitar SMB1 melhora a segurança (SMB1 é vulnerável a EternalBlue).
    server min protocol = SMB2

    # Resolução de nomes NetBIOS (para acesso por nome em redes Windows).
    # wins support = yes: o Samba age como servidor WINS, permitindo que
    # clientes Windows encontrem o servidor pelo nome "AUXNET" além do IP.
    # Opcional para o projeto — o acesso por IP já funciona sem isso.
    # wins support = yes

    # Impressoras: desabilitadas completamente.
    # Sem isso, o Samba tenta descobrir impressoras no sistema, gerando
    # entradas desnecessárias no Explorador de Arquivos dos clientes.
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes


# ── Seção [compartilhado]: o único share do projeto ──────────────────────────
[compartilhado]

    # Nome do compartilhamento conforme aparece nos clientes:
    # Windows: \\192.168.1.10\compartilhado
    # iOS:     smb://192.168.1.10/compartilhado
    # O nome em português facilita o reconhecimento pelos hóspedes.

    # ── Descrição exibida nos clientes ──────────────────────────────────────
    comment = Guia da Casa — AuxNet

    # ── Caminho físico no sistema de arquivos do Raspberry Pi ───────────────
    # Este diretório é criado pelo script setup_samba.sh.
    # Permissões: dono auxnet:auxnet, chmod 750 (leitura para grupo auxnet).
    path = /home/auxnet/compartilhado

    # ── Visibilidade do compartilhamento ────────────────────────────────────
    # browseable = yes: o compartilhamento aparece na lista quando o cliente
    # navega para \\192.168.1.10 ou smb://192.168.1.10.
    #
    # Por que não esconder (browseable = no)?
    #   Os hóspedes não têm conhecimento técnico — precisam ver o
    #   compartilhamento listado para saber que existe. Esconder exigiria
    #   que eles soubessem o nome exato do share para acessá-lo.
    #   A segurança é garantida pela autenticação, não pela obscuridade.
    browseable = yes

    # ── Permissões de escrita ────────────────────────────────────────────────
    # read only = yes: hóspedes podem APENAS ler os arquivos do guia.
    #
    # Por que somente leitura?
    #   1. Segurança: impede que hóspedes modifiquem ou deletem o guia.
    #   2. Integridade: garante que o conteúdo do guia seja sempre o que
    #      o proprietário publicou, sem alterações acidentais ou maliciosas.
    #   3. O proprietário atualiza o guia remotamente via Tailscale,
    #      conectando-se ao Raspberry Pi e editando os arquivos diretamente.
    read only = yes

    # ── Acesso de convidados ─────────────────────────────────────────────────
    # guest ok = no: nenhum acesso sem autenticação.
    #
    # Por que não permitir guest?
    #   O guia contém a senha do Wi-Fi. Sem autenticação, qualquer
    #   dispositivo na LAN poderia ler esse dado — incluindo dispositivos
    #   de visitas não autorizadas que se conectarem à rede.
    #   As credenciais Samba são fornecidas pelo proprietário no check-in.
    guest ok = no

    # ── Usuários autorizados ─────────────────────────────────────────────────
    # Somente o usuário "auxnet" (criado pelo setup_samba.sh) pode acessar.
    # Este usuário é compartilhado entre todos os hóspedes — credenciais
    # únicas simplificam o processo de check-in.
    #
    # Em versões futuras: criar um usuário por temporada (ex: "hospede2026")
    # para poder revogar o acesso após o término da locação.
    valid users = auxnet

    # ── Máscara de criação de arquivos (informativa) ─────────────────────────
    # Embora read only = yes impeça criação de novos arquivos pelos hóspedes,
    # quando o proprietário criar arquivos via Tailscale, eles terão
    # permissão 644 (leitura para todos, escrita apenas para o dono).
    create mask = 0644
    directory mask = 0755
