# =============================================================================
# AuxNet — Configuração do servidor Nginx
# =============================================================================
#
# Projeto:  AuxNet (Equipe Píton — PUCPR CTIC 2026/S1)
# Hardware: Raspberry Pi 3 Model B (192.168.1.10)
# Pacote:   nginx versão 1.22 (disponível nos repos do Debian 12 Bookworm)
#
# Como instalar:
#   1. Copie este arquivo para /etc/nginx/sites-available/auxnet
#   2. Crie o symlink: ln -s /etc/nginx/sites-available/auxnet \
#                              /etc/nginx/sites-enabled/auxnet
#   3. Remova o site padrão: rm /etc/nginx/sites-enabled/default
#   4. Valide a config: nginx -t
#   5. Reinicie: systemctl restart nginx
#
# O script scripts/setup_nginx.sh faz tudo isso automaticamente.
# =============================================================================

server {

    # ── Porta de escuta ──────────────────────────────────────────────────────
    # Porta 80 é o padrão HTTP. Os hóspedes acessam http://192.168.1.10 sem
    # precisar digitar a porta — qualquer outra porta exigiria instrução
    # adicional (ex: http://192.168.1.10:8080), aumentando a fricção.
    #
    # Por que não HTTPS (porta 443)?
    #   Na rede local AuxNet, o tráfego já é protegido pelo isolamento físico
    #   da LAN — apenas dispositivos conectados à rede AuxNet têm acesso.
    #   O acesso remoto do proprietário passa pelo Tailscale, que criptografa
    #   o túnel WireGuard end-to-end. Adicionar TLS/HTTPS exigiria um
    #   certificado autoassinado (gerando alertas de segurança no browser)
    #   ou um certificado válido (exige domínio público), nenhum dos quais
    #   é viável para uma LAN isolada. HTTP na LAN é a escolha correta aqui.
    listen 80;

    # ── Nomes de servidor aceitos ─────────────────────────────────────────────
    # 192.168.1.10: IP fixo do Raspberry Pi — acesso direto por IP (padrão).
    # auxnet.local: nome mDNS/Bonjour disponível em redes com suporte a
    #   multicast DNS. Dispositivos Apple (iPhone, Mac) resolvem .local
    #   automaticamente via Bonjour. Windows 10+ também suporta mDNS.
    #   Requer que o Avahi daemon esteja instalado no Raspberry Pi:
    #   apt-get install -y avahi-daemon
    #   Se o Avahi não estiver configurado, o acesso por IP continua funcionando.
    server_name 192.168.1.10 auxnet.local;

    # ── Diretório raiz dos arquivos estáticos ─────────────────────────────────
    # Nginx serve os arquivos deste diretório para as requisições.
    # O setup_nginx.sh copia html/index.html do repositório para cá.
    # Permissões corretas: sudo chown -R www-data:www-data /var/www/auxnet
    root /var/www/auxnet;

    # ── Arquivo de índice padrão ──────────────────────────────────────────────
    # Quando o cliente acessa http://192.168.1.10/ (sem nome de arquivo),
    # o Nginx serve automaticamente index.html.
    index index.html;

    # ── Localização padrão ────────────────────────────────────────────────────
    location / {
        # try_files tenta servir o arquivo solicitado. Se não existir,
        # tenta o diretório. Se nenhum existir, retorna 404.
        # Para um site estático simples, este é o comportamento correto.
        try_files $uri $uri/ =404;
    }

    # ── Cabeçalhos de segurança HTTP ─────────────────────────────────────────
    # Mesmo em uma LAN, boas práticas de segurança se aplicam.
    # Estes cabeçalhos protegem contra ataques comuns de browser.

    # X-Frame-Options: impede que a página seja embutida em um <iframe>
    # em outro site (proteção contra clickjacking).
    # SAMEORIGIN permite iframes do mesmo domínio (não usado aqui, mas
    # é menos restritivo que DENY, mantendo compatibilidade futura).
    add_header X-Frame-Options "SAMEORIGIN" always;

    # X-Content-Type-Options: impede que o browser "adivinhe" o tipo MIME
    # de um arquivo baseado no conteúdo (MIME sniffing). Sem isso, um
    # arquivo .txt com conteúdo HTML poderia ser executado como HTML.
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer-Policy: controla quanta informação é enviada no cabeçalho
    # Referer ao navegar para outros sites. "no-referrer" não envia nada —
    # adequado para uma página local sem analytics.
    add_header Referrer-Policy "no-referrer" always;

    # ── Logs ──────────────────────────────────────────────────────────────────
    # Separar os logs do AuxNet dos logs globais do Nginx facilita o debug
    # sem misturar com logs de outros sites (caso existam).
    # Para ver em tempo real: journalctl -u nginx -f
    # Ou diretamente: tail -f /var/log/nginx/auxnet-access.log
    access_log /var/log/nginx/auxnet-access.log;
    error_log  /var/log/nginx/auxnet-error.log;

    # ── Charset padrão ───────────────────────────────────────────────────────
    # Garante que o Content-Type inclua charset=UTF-8 para arquivos HTML,
    # mesmo que o arquivo HTML não declare o meta charset.
    # Evita problemas com caracteres especiais (ã, é, ç) em browsers antigos.
    charset utf-8;

    # ── Cache de arquivos estáticos ───────────────────────────────────────────
    # Arquivos estáticos (CSS, JS, imagens, se houver) podem ser cacheados
    # pelos browsers para reduzir requisições repetidas.
    # O HTML principal não tem cache (max-age=0) para sempre mostrar
    # a versão mais recente caso o proprietário atualize o conteúdo.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
